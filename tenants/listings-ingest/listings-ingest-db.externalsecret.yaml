apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: listings-ingest-db
  namespace: listings-ingest
  labels:
    zave.io/workload: listings-ingest
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: listings-ingest-db
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: tenants/listings-ingest/db
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: tenants/listings-ingest/db
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: tenants/listings-ingest/db
        property: DB_NAME
    - secretKey: DB_USER
      remoteRef:
        key: tenants/listings-ingest/db
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: tenants/listings-ingest/db
        property: DB_PASSWORD
    - secretKey: DB_SSLMODE
      remoteRef:
        key: tenants/listings-ingest/db
        property: DB_SSLMODE
