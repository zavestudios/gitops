apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: mia
  labels:
    app: ollama
    app.kubernetes.io/name: ollama
    app.kubernetes.io/version: "0.17.7"
spec:
  replicas: 0
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ollama
      zave.io/managed-by: argocd
      zave.io/workload: mia
  template:
    metadata:
      labels:
        app: ollama
        app.kubernetes.io/name: ollama
        app.kubernetes.io/version: "0.17.7"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      automountServiceAccountToken: false
      containers:
      - name: ollama
        image: docker.io/ollama/ollama:0.17.7
        env:
        - name: HOME
          value: /home/ollama
        - name: OLLAMA_HOME
          value: /home/ollama/.ollama
        securityContext:
          runAsNonRoot: true
        volumeMounts:
        - name: ollama-data
          mountPath: /home/ollama/.ollama
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        startupProbe:
          tcpSocket:
            port: 11434
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 11434
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 11434
          periodSeconds: 30
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data
