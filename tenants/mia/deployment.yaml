apiVersion: apps/v1
kind: Deployment
metadata:
  name: mia
  namespace: mia
  labels:
    app.kubernetes.io/version: sha-161c5ed
    app: mia
    zave.io/workload: mia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mia
  template:
    metadata:
      labels:
        app: mia
        app.kubernetes.io/name: mia
        app.kubernetes.io/version: sha-161c5ed
        zave.io/workload: mia
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: mia
        image: ghcr.io/zavestudios/mia@sha256:df45c615959b3c15d10f20eaad0f1b2f76ca4b46073964824d59f23190626962
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 18789
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 18789
          initialDelaySeconds: 15
          periodSeconds: 5
