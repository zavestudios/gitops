apiVersion: apps/v1
kind: Deployment
metadata:
  name: mia
  namespace: mia
  labels:
    app.kubernetes.io/version: sha-161c5ed
    app: mia
    zave.io/workload: mia
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mia
  template:
    metadata:
      labels:
        app: mia
        app.kubernetes.io/name: mia
        app.kubernetes.io/version: sha-161c5ed
        zave.io/workload: mia
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-secret
      securityContext:                                                                                                                                                                       
        runAsUser: 1000                                                                                                                                                                      
        runAsGroup: 1000                                                                                                                                                                     
        fsGroup: 1000
      containers:
      - name: mia
        securityContext:
          runAsNonRoot: true
        image: ghcr.io/zavestudios/mia@sha256:ccba7e622f489d4243a50e372785903d4f24f7533e1dbf7056e4782247b7d5b1
        startupProbe:
          tcpSocket:
            port: 18789
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 18789
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 18789
          periodSeconds: 30
          timeoutSeconds: 2
          failureThreshold: 3
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=768"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
