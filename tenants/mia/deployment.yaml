apiVersion: apps/v1
kind: Deployment
metadata:
  name: mia
  namespace: mia
  labels:
    app.kubernetes.io/version: sha-0ffcdb4
    app: mia
    zave.io/workload: mia
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mia
  template:
    metadata:
      labels:
        app: mia
        app.kubernetes.io/name: mia
        app.kubernetes.io/version: sha-0ffcdb4
        zave.io/workload: mia
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: seed-config
        image: ghcr.io/zavestudios/mia@sha256:f21c43e524fe7e2e1ed1324b72b7f39840105a9d76628ed7c09f6d9ace59372b
        command:
        - sh
        - -c
        - |
          if [ ! -f /data/openclaw.json ]; then
            cp -r /home/node/.openclaw/* /data/
            echo "Seeded initial config to persistent volume"
          else
            echo "Config already exists on persistent volume, skipping seed"
          fi
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: mia
        securityContext:
          runAsNonRoot: true
        image: ghcr.io/zavestudios/mia@sha256:f21c43e524fe7e2e1ed1324b72b7f39840105a9d76628ed7c09f6d9ace59372b
        startupProbe:
          tcpSocket:
            port: 18789
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 18789
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 18789
          periodSeconds: 30
          timeoutSeconds: 2
          failureThreshold: 3
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: mia-provider
              key: ANTHROPIC_API_KEY
        - name: OLLAMA_HOST
          value: "http://ollama.mia.svc.cluster.local:11434"
        - name: NODE_ENV
          value: "production"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1536"
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /home/node/.openclaw
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mia-data
