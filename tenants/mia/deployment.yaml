apiVersion: apps/v1
kind: Deployment
metadata:
  name: mia
  namespace: mia
  labels:
    app.kubernetes.io/version: sha-161c5ed
    app: mia
    zave.io/workload: mia
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mia
  template:
    metadata:
      labels:
        app: mia
        app.kubernetes.io/name: mia
        app.kubernetes.io/version: sha-161c5ed
        zave.io/workload: mia
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      securityContext:                                                                                                                                                                       
        runAsUser: 1000                                                                                                                                                                      
        runAsGroup: 1000                                                                                                                                                                     
        fsGroup: 1000
      containers:
      - name: mia
        securityContext:
          runAsNonRoot: true
        image: ghcr.io/zavestudios/mia@sha256:1f7cc91dff05119477109ba3514a020a371e017fb31af14c83f5e71317e5f7f9
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        startupProbe:
          exec:
            command:
            - sh
            - -lc
            - openclaw gateway health --json >/dev/null
          periodSeconds: 15
          timeoutSeconds: 20
          failureThreshold: 60
        env:
        - name: NODE_ENV
          value: "production"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=768"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
