apiVersion: apps/v1
kind: Deployment
metadata:
  name: mia
  namespace: mia
  labels:
    app.kubernetes.io/version: sha-5e313b0
    app: mia
    zave.io/workload: mia
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: mia
  template:
    metadata:
      labels:
        app: mia
        app.kubernetes.io/name: mia
        app.kubernetes.io/version: sha-5e313b0
        zave.io/workload: mia
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: seed-config
        image: ghcr.io/zavestudios/mia@sha256:023aafc032f3f7894393a5c497cec8d235b9a4866a5f7f5b2af284cc571d7c56
        command:
        - sh
        - -c
        - |
          if [ ! -f /data/openclaw.json ]; then
            cp -r /home/node/.openclaw/* /data/
            echo "Seeded initial config to persistent volume"
          else
            echo "Config already exists on persistent volume, skipping seed"
          fi
        volumeMounts:
        - name: data
          mountPath: /data
      - name: reconcile-openclaw-config
        image: ghcr.io/zavestudios/mia@sha256:023aafc032f3f7894393a5c497cec8d235b9a4866a5f7f5b2af284cc571d7c56
        command:
        - sh
        - -c
        - |
          set -euo pipefail

          if [ ! -f /home/node/.openclaw/openclaw.json ]; then
            echo "Expected /home/node/.openclaw/openclaw.json on the persistent volume" >&2
            exit 1
          fi

          openclaw config set gateway.auth.mode token
          openclaw config set gateway.auth.token --ref-provider default --ref-source env --ref-id OPENCLAW_GATEWAY_TOKEN
          openclaw config set commands.ownerAllowFrom "$OPENCLAW_OWNER_ALLOW_FROM" --strict-json
        env:
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: mia-provider
              key: OPENCLAW_GATEWAY_TOKEN
        - name: OPENCLAW_OWNER_ALLOW_FROM
          valueFrom:
            secretKeyRef:
              name: mia-provider
              key: OPENCLAW_OWNER_ALLOW_FROM
        volumeMounts:
        - name: data
          mountPath: /home/node/.openclaw
      containers:
      - name: mia
        securityContext:
          runAsNonRoot: true
        image: ghcr.io/zavestudios/mia@sha256:023aafc032f3f7894393a5c497cec8d235b9a4866a5f7f5b2af284cc571d7c56
        startupProbe:
          tcpSocket:
            port: 18789
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: 18789
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 18789
          periodSeconds: 30
          timeoutSeconds: 2
          failureThreshold: 3
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: mia-provider
              key: ANTHROPIC_API_KEY
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: mia-provider
              key: OPENCLAW_GATEWAY_TOKEN
        - name: OLLAMA_HOST
          value: "http://ollama.mia.svc.cluster.local:11434"
        - name: NODE_ENV
          value: "production"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=1536"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://alloy-receiver.alloy.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_SERVICE_NAME
          value: "mia-gateway"
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /home/node/.openclaw
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mia-data
