apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mia

resources:
  # GHCR pull secret remains on Sealed Secrets until the Vault migration is validated.
  - mia-provider.external-secret.yaml
  - ghcr-secret.sealed.yaml
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ollama-pvc.yaml
  - ollama-deployment.yaml
  - mia-data-pvc.yaml
  - ollama-service.yaml
  - ingress.yaml
  - canary-deployment.yaml
  - canary-service.yaml
  - canary-ingress.yaml
  - serviceaccount.yaml

commonLabels:
  zave.io/workload: mia
  zave.io/managed-by: argocd
