apiVersion: apps/v1
kind: Deployment
metadata:
  name: mia-canary
  namespace: mia
  labels:
    app: mia-canary
    app.kubernetes.io/name: mia
    app.kubernetes.io/component: canary
    app.kubernetes.io/version: sha-161c5ed
    zave.io/workload: mia
spec:
  # Canary is disabled by default; set to 1 during canary validation.
  replicas: 0
  selector:
    matchLabels:
      app: mia-canary
  template:
    metadata:
      labels:
        app: mia-canary
        app.kubernetes.io/name: mia
        app.kubernetes.io/component: canary
        app.kubernetes.io/version: sha-161c5ed
        zave.io/workload: mia
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: mia
        securityContext:
          runAsNonRoot: true
        image: ghcr.io/zavestudios/mia@sha256:bfed1742f7885dfd826fd7fe83ce38c518a2b8549efd3a0e5ed3b7a1f56bef04
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=768"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
