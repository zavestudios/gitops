apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mia-provider
  namespace: mia
  labels:
    zave.io/workload: mia
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: mia-provider
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: tenants/mia/provider
        property: ANTHROPIC_API_KEY
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: tenants/mia/provider
        property: OPENCLAW_GATEWAY_TOKEN
    - secretKey: OPENCLAW_OWNER_ALLOW_FROM
      remoteRef:
        key: tenants/mia/provider
        property: OPENCLAW_OWNER_ALLOW_FROM
