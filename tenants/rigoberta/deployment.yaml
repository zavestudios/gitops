apiVersion: apps/v1
kind: Deployment
metadata:
  name: rigoberta
  namespace: rigoberta
  labels:
    app: rigoberta
    app.kubernetes.io/version: sha-03237f0
    zave.io/workload: rigoberta
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: rigoberta
  template:
    metadata:
      labels:
        app: rigoberta
        app.kubernetes.io/name: rigoberta
        app.kubernetes.io/version: sha-03237f0
        zave.io/workload: rigoberta
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: rigoberta
          image: ghcr.io/zavestudios/rigoberta@sha256:b135d55ed3d6f105df8c0f28a723a0faaedbe16bc8f5e01b93e80470316ad69b
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
            - containerPort: 9394
              name: metrics
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: RAILS_ENV
              value: production
            - name: PIDFILE
              value: /tmp/server.pid
            - name: PORT
              value: "3000"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: RAILS_SERVE_STATIC_FILES
              value: "true"
            - name: METRICS_PORT
              value: "9394"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rigoberta-db
                  key: DATABASE_URL
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: rigoberta-app
                  key: SECRET_KEY_BASE
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rigoberta-app
                  key: REDIS_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
