apiVersion: v1
kind: Service
metadata:
  name: rigoberta
  namespace: rigoberta
  labels:
    app: rigoberta
    zave.io/workload: rigoberta
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
    - port: 9394
      targetPort: 9394
      protocol: TCP
      name: metrics
  selector:
    app: rigoberta
