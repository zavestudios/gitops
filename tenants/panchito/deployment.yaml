apiVersion: apps/v1
kind: Deployment
metadata:
  name: panchito
  namespace: panchito
  labels:
    app: panchito
    app.kubernetes.io/version: sha-78e7425
    zave.io/workload: panchito
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: panchito
  template:
    metadata:
      labels:
        app: panchito
        app.kubernetes.io/name: panchito
        app.kubernetes.io/version: sha-78e7425
        zave.io/workload: panchito
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: panchito
          image: ghcr.io/zavestudios/panchito@sha256:f44cf93bad58d9c03c2d463012f5619aa0ad87fa081f0ddd71c177cc1cc76adf
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: FLASK_ENV
              value: production
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER_URL
              value: https://sso.zavestudios.com/auth/realms/zavestudios
            - name: OIDC_CLIENT_ID
              value: panchito
            - name: APP_BASE_URL
              value: https://panchito-on-prem.zavestudios.com
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: panchito-app
                  key: SECRET_KEY
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: panchito-app
                  key: OIDC_CLIENT_SECRET
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: panchito-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: panchito-db
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: panchito-db
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: panchito-db
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: panchito-db
                  key: DB_NAME
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: panchito-app
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: panchito-app
                  key: CELERY_RESULT_BACKEND
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: panchito-app
                  key: LOG_LEVEL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
