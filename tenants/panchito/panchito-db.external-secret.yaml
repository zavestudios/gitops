apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: panchito-db
  namespace: panchito
  labels:
    zave.io/workload: panchito
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-kv
  target:
    name: panchito-db
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DB_USER
      remoteRef:
        key: tenants/panchito/db
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: tenants/panchito/db
        property: DB_PASSWORD
    - secretKey: DB_HOST
      remoteRef:
        key: tenants/panchito/db
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: tenants/panchito/db
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: tenants/panchito/db
        property: DB_NAME
    - secretKey: DATABASE_URL
      remoteRef:
        key: tenants/panchito/db
        property: DATABASE_URL
