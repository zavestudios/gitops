apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle
  namespace: oracle
  labels:
    app: oracle
    app.kubernetes.io/version: sha-653d232
    zave.io/workload: oracle
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
        app.kubernetes.io/name: oracle
        app.kubernetes.io/version: sha-653d232
        zave.io/workload: oracle
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-secret
      initContainers:
      - name: wait-for-schema
        image: docker.io/library/postgres:16-alpine
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: oracle-db
              key: DATABASE_URL
        command:
        - sh
        - -ec
        - |
          until psql "$DATABASE_URL" -tAc "select 1 from information_schema.tables where table_schema = 'oracle' and table_name = 'jobs'" | grep -q 1; do
            echo "waiting for oracle schema";
            sleep 2;
          done
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: oracle
        image: ghcr.io/zavestudios/oracle@sha256:467946759d21a2e2d66f3102fdfb5b876d4e6c24f47a0cc2517357646dda0176
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: oracle-db
              key: DATABASE_URL
        - name: LEASE_SECONDS
          value: "60"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
