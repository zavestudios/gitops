---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bigbang
  namespace: bigbang
spec:
  interval: 10m
  driftDetection:
    # Recreate or patch drifted resources from Helm storage during steady-state
    # reconciliation. This hardens Big Bang child objects like HelmRelease/keycloak
    # against silent live-state deletion.
    mode: enabled
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: bigbang
        namespace: bigbang
      interval: 10m
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: bigbang-values
      valuesKey: values.yaml
