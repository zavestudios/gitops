---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bigbang
  namespace: bigbang
spec:
  interval: 10m
  driftDetection:
    # Recreate or patch drifted resources from Helm storage during steady-state
    # reconciliation. This hardens Big Bang child objects like HelmRelease/keycloak
    # against silent live-state deletion.
    mode: enabled
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: bigbang
        namespace: bigbang
      interval: 10m
  timeout: 20m
  install:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              namespace: argocd
              labelSelector: app.kubernetes.io/instance=argocd-argocd
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              namespace: argocd
              labelSelector: app.kubernetes.io/instance=argocd-argocd
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: not-used
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: bigbang-values
      valuesKey: values.yaml
