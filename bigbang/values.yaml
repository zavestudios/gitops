# Big Bang values for sandbox environment
# Clean configuration using post-renderers for image rewrites

# Domain configuration
domain: sandbox.zavestudios.com

# Disable packages requiring Iron Bank access
gatekeeper:
  enabled: false

kyverno:
  enabled: true
  values:
    global:
      image:
        registry: ""  # Prevent registry prepending
    upstream:
      admissionController:
        container:
          image:
            defaultRegistry: ghcr.io
            repository: kyverno/kyverno
            tag: v1.16.3
        initContainer:
          image:
            defaultRegistry: ghcr.io
            repository: kyverno/kyvernopre
            tag: v1.16.3
      backgroundController:
        image:
          defaultRegistry: ghcr.io
          repository: kyverno/background-controller
          tag: v1.16.3
      cleanupController:
        image:
          defaultRegistry: ghcr.io
          repository: kyverno/cleanup-controller
          tag: v1.16.3
      reportsController:
        image:
          defaultRegistry: ghcr.io
          repository: kyverno/reports-controller
          tag: v1.16.3
      crds:
        migration:
          image:
            defaultRegistry: ghcr.io
            repository: kyverno/kyverno-cli
            tag: v1.16.3
      webhooksCleanup:
        image:
          registry: registry.k8s.io
          repository: kubectl
          tag: v1.34.3

kyvernoPolicies:
  enabled: false

eckOperator:
  enabled: false

elasticsearchKibana:
  enabled: false

fluentbit:
  enabled: false

loki:
  enabled: false

neuvector:
  enabled: false

twistlock:
  enabled: false

# Istio - enabled with public images via values overrides
istioCRDs:
  enabled: true

istiod:
  enabled: true
  flux:
    install:
      disableHooks: true
    upgrade:
      disableHooks: true
  values:
    upstream:
      global:
        hub: docker.io/istio
        tag: 1.28.3

istioGateway:
  enabled: true
  flux:
    install:
      disableHooks: true
    upgrade:
      disableHooks: true
  values:
    gateways:
      public:
        upstream:
          global:
            hub: docker.io/istio
            tag: 1.28.3
      passthrough: {}  # Disabled - empty config

# Addons
addons:
  gitlab:
    enabled: false
  gitlabRunner:
    enabled: false

  argocd:
    enabled: true
    values:
      upgradeJob:
        enabled: false  # Disable upgrade job to avoid Iron Bank image
      global:
        image:
          repository: quay.io/argoproj/argocd
      upstream:
        dex:
          image:
            repository: ghcr.io/dexidp/dex
      redis-bb:
        upstream:
          global:
            imageRegistry: ""
          image:
            registry: public.ecr.aws
            repository: docker/library/redis
          metrics:
            image:
              registry: ghcr.io
              repository: oliver006/redis_exporter
            command:
              - /redis_exporter

# Monitoring stack with public images via values overrides
monitoring:
  enabled: true
  values:
    upstream:
      global:
        imageRegistry: ""  # Disable registry prepending
      prometheusOperator:
        image:
          registry: quay.io
          repository: prometheus-operator/prometheus-operator
        prometheusConfigReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
        admissionWebhooks:
          enabled: false  # Disabled to avoid Iron Bank image issues
      prometheus:
        prometheusSpec:
          image:
            registry: quay.io
            repository: prometheus/prometheus
      alertmanager:
        alertmanagerSpec:
          image:
            registry: quay.io
            repository: prometheus/alertmanager
      prometheus-node-exporter:
        image:
          registry: quay.io
          repository: prometheus/node-exporter
      kube-state-metrics:
        image:
          registry: registry.k8s.io
          repository: kube-state-metrics/kube-state-metrics
      grafana:
        image:
          registry: docker.io
          repository: grafana/grafana
        sidecar:
          image:
            registry: quay.io
            repository: kiwigrid/k8s-sidecar

# Kiali - service mesh observability (disabled due to x86-64-v2 CPU requirement incompatibility)
kiali:
  enabled: false
  values:
    upstream:
      allowAdHocKialiImage: true  # Allow custom image override
      image:
        repo: quay.io/kiali/kiali-operator
      cr:
        spec:
          deployment:
            image_name: quay.io/kiali/kiali

# Standalone Grafana
grafana:
  enabled: true
  values:
    upstream:
      global:
        imageRegistry: ""  # Disable registry prepending
      image:
        repository: docker.io/grafana/grafana
      sidecar:
        image:
          repository: quay.io/kiwigrid/k8s-sidecar
      initChownData:
        enabled: false

# Tempo - distributed tracing (disabled due to x86-64-v2 CPU requirement incompatibility)
tempo:
  enabled: false
  values:
    upstream:
      tempo:
        registry: docker.io
        repository: grafana/tempo
