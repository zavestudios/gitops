# Big Bang values for on-prem environment
# Clean configuration using post-renderers for image rewrites

# Domain configuration
# Using root domain for on-prem environment hostnames
domain: zavestudios.com

# Disable packages requiring Iron Bank access
gatekeeper:
  enabled: false

kyverno:
  enabled: true
  flux:
    install:
      replace: true  # Force fresh install, ignore phantom state
  values:
    global:
      image:
        registry: ""  # Prevent registry prepending
    upstream:
      admissionController:
        container:
          image:
            defaultRegistry: ghcr.io
            repository: kyverno/kyverno
            tag: v1.16.3
        initContainer:
          image:
            defaultRegistry: ghcr.io
            repository: kyverno/kyvernopre
            tag: v1.16.3
      backgroundController:
        image:
          defaultRegistry: ghcr.io
          repository: kyverno/background-controller
          tag: v1.16.3
      cleanupController:
        image:
          defaultRegistry: ghcr.io
          repository: kyverno/cleanup-controller
          tag: v1.16.3
      reportsController:
        image:
          defaultRegistry: ghcr.io
          repository: kyverno/reports-controller
          tag: v1.16.3
      crds:
        migration:
          image:
            defaultRegistry: ghcr.io
            repository: kyverno/kyverno-cli
            tag: v1.16.3
      webhooksCleanup:
        image:
          registry: registry.k8s.io
          repository: kubectl
          tag: v1.34.3

kyvernoReporter:
  enabled: true
  values:
    upstream:
      image:
        registry: ghcr.io
        repository: kyverno/policy-reporter
        tag: "3.7.2"
      ui:
        enabled: true
        image:
          registry: ghcr.io
          repository: kyverno/policy-reporter-ui
          tag: "2.5.1"
      plugin:
        kyverno:
          enabled: true
          image:
            registry: ghcr.io
            repository: kyverno/policy-reporter/kyverno-plugin
            tag: "0.5.3"

kyvernoPolicies:
  enabled: true
  values:
    waitJob:
      enabled: false  # Disable wait job - gluon uses hardcoded Iron Bank kubectl image
    bbtests:
      enabled: false  # Disable tests
      scripts:
        image: registry.k8s.io/kubectl:v1.34.3
    policies:
      restrict-image-registries:
        parameters:
          allow:
            - registry1.dso.mil/  # Iron Bank (for reference)
            - ghcr.io/            # GitHub Container Registry
            - quay.io/            # Red Hat Quay
            - docker.io/          # Docker Hub
            - index.docker.io/    # Docker Hub canonical hostname
            - registry.k8s.io/    # Kubernetes registry
            - public.ecr.aws/     # AWS Public ECR

eckOperator:
  enabled: false

elasticsearchKibana:
  enabled: false

fluentbit:
  enabled: false

neuvector:
  enabled: false

twistlock:
  enabled: false

# Istio - enabled with public images via values overrides
istioCRDs:
  enabled: true

istiod:
  enabled: true
  flux:
    install:
      disableHooks: true
    upgrade:
      disableHooks: true
  values:
    upstream:
      global:
        hub: docker.io/istio
        tag: 1.28.3

istioGateway:
  enabled: true
  flux:
    install:
      disableHooks: true
    upgrade:
      disableHooks: true
  values:
    gateways:
      public:
        gateway:
          servers:
          - hosts:
            - '*.zavestudios.com'
            port:
              name: http
              number: 8080
              protocol: HTTP
            tls:
              httpsRedirect: false  # Cloudflare Tunnel terminates TLS
        upstream:
          global:
            hub: docker.io/istio
            tag: 1.28.3
      passthrough: {}  # Disabled - empty config

# Addons
addons:
  gitlab:
    enabled: false
  gitlabRunner:
    enabled: false

  externalSecrets:
    enabled: true
    values:
      waitJob: false
      upstream:
        podLabels:
          vault-ingress: "true"
        image:
          repository: ghcr.io/external-secrets/external-secrets
          tag: v1.2.1
        imagePullSecrets: []
        webhook:
          image:
            repository: ghcr.io/external-secrets/external-secrets
            tag: v1.2.1
          imagePullSecrets: []
        certController:
          image:
            repository: ghcr.io/external-secrets/external-secrets
            tag: v1.2.1
          imagePullSecrets: []

  vault:
    enabled: true
    values:
      global:
        imageRegistry: ""  # Disable registry prepending
      autoInit:
        enabled: false  # Disable auto-init job (requires Iron Bank, not for production)
      upstream:
        server:
          ha:
            apiAddr: "http://vault.vault.svc.cluster.local:8200"
          image:
            repository: docker.io/hashicorp/vault
            tag: 1.21.2
          standalone:
            config: |
              ui = true
              api_addr = "http://vault.vault.svc.cluster.local:8200"

              seal "awskms" {
                region     = "us-west-2"
                kms_key_id = "alias/zavestudios-onprem-vault-auto-unseal"
              }

              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }

              telemetry {
                prometheus_retention_time = "24h"
                disable_hostname = true
                unauthenticated_metrics_access = true
              }

              storage "file" {
                path = "/vault/data"
              }
          # Security: disable automount of service account token
          serviceAccount:
            create: true
            automountServiceAccountToken: false
          extraSecretEnvironmentVars:
            - envName: AWS_ACCESS_KEY_ID
              secretName: vault-aws-auto-unseal
              secretKey: AWS_ACCESS_KEY_ID
            - envName: AWS_SECRET_ACCESS_KEY
              secretName: vault-aws-auto-unseal
              secretKey: AWS_SECRET_ACCESS_KEY
          # Add required labels for Kyverno policies
          statefulSet:
            annotations:
              kyverno.io/ignore: "false"
          extraLabels:
            app.kubernetes.io/version: "1.21.2"
        injector:
          enabled: false  # Disabled - conflicts with Kyverno, prefer External Secrets Operator
          image:
            repository: docker.io/hashicorp/vault-k8s
            tag: 1.7.3
          agentImage:
            repository: docker.io/hashicorp/vault
            tag: 1.21.2
          # Security: disable automount of service account token
          authDelegator:
            enabled: false  # Disable if not using auth delegation
          serviceAccount:
            create: true
          automountServiceAccountToken: false  # Pod-level setting
          extraLabels:
            app.kubernetes.io/version: "1.7.3"
        csi:
          enabled: false  # Disable CSI provider if not needed
          image:
            repository: docker.io/hashicorp/vault-csi-provider
            tag: 1.7.0
          # Security: disable automount of service account token
          serviceAccount:
            create: true
          automountServiceAccountToken: false  # Pod-level setting
          extraLabels:
            app.kubernetes.io/version: "1.7.0"

  keycloak:
    enabled: true
    ingress:
      gateway: "public"
      cert: ""
      key: ""
    values:
      global:
        imageRegistry: ""  # Disable registry prepending
      istio:
        keycloak:
          hosts:
            - sso.zavestudios.com  # KeyCloak SSO endpoint
      upstream:
        image:
          repository: quay.io/keycloak/keycloak
        replicas: 1  # Single instance for Formation phase, scale later for HA
        # Database connection via environment variables from External Secrets
        # Database provisioned via pg/scripts/provision_tenant.sh
        postgresql:
          enabled: false  # Disable embedded PostgreSQL, using external instead
        # Credentials from Vault via External Secrets Operator
        # Vault paths:
        #   - secret/platform/services/keycloak/db (database credentials)
        #   - secret/platform/services/keycloak/admin (admin credentials)
        secrets:
          env:
            stringData:
              # Database connection
              KC_DB: "postgres"
              KC_DB_URL_HOST: "192.168.122.20"
              KC_DB_URL_PORT: "5432"
              KC_DB_URL_DATABASE: "db_keycloak"
              KC_DB_USERNAME: "keycloak_app"
              # Hostname and proxy configuration
              KC_METRICS_ENABLED: "true"
              KC_HOSTNAME: "sso.zavestudios.com"
              KC_HOSTNAME_STRICT: "false"
              KC_PROXY: "edge"
        # Mount secrets as environment variables
        extraEnvFrom: |
          - secretRef:
              name: keycloak-postgres-credentials
          - secretRef:
              name: keycloak-admin-credentials
        # Provide writable directories for KeyCloak Quarkus build
        extraVolumes: |
          - name: keycloak-data
            emptyDir: {}
          - name: tmp
            emptyDir: {}
        extraVolumeMounts: |
          - name: keycloak-data
            mountPath: /opt/keycloak/data
          - name: tmp
            mountPath: /tmp

  argocd:
    enabled: true
    values:
      upgradeJob:
        enabled: false  # Disable upgrade job to avoid Iron Bank image
      global:
        image:
          repository: quay.io/argoproj/argocd
      upstream:
        dex:
          image:
            repository: ghcr.io/dexidp/dex
      redis-bb:
        upstream:
          global:
            imageRegistry: ""
          image:
            registry: public.ecr.aws
            repository: docker/library/redis
          metrics:
            image:
              registry: ghcr.io
              repository: oliver006/redis_exporter
            command:
              - /redis_exporter

# Monitoring stack with public images via values overrides
monitoring:
  enabled: true
  values:
    upstream:
      global:
        imageRegistry: ""  # Disable registry prepending
      prometheusOperator:
        image:
          registry: quay.io
          repository: prometheus-operator/prometheus-operator
        prometheusConfigReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
        admissionWebhooks:
          enabled: true
          patch:
            image:
              registry: registry.k8s.io
              repository: ingress-nginx/kube-webhook-certgen
              tag: v1.6.5
              pullPolicy: IfNotPresent
      prometheus:
        prometheusSpec:
          image:
            registry: quay.io
            repository: prometheus/prometheus
          serviceAccountName: prometheus-monitoring-monitoring-kube-prometheus
          automountServiceAccountToken: false  # Disable for Kyverno policy compliance
      alertmanager:
        alertmanagerSpec:
          image:
            registry: quay.io
            repository: prometheus/alertmanager
      prometheus-node-exporter:
        image:
          registry: quay.io
          repository: prometheus/node-exporter
      kube-state-metrics:
        image:
          registry: registry.k8s.io
          repository: kube-state-metrics/kube-state-metrics
      grafana:
        image:
          registry: docker.io
          repository: grafana/grafana
        sidecar:
          image:
            registry: quay.io
            repository: kiwigrid/k8s-sidecar

# Kiali - service mesh observability (disabled due to x86-64-v2 CPU requirement incompatibility)
kiali:
  enabled: false
  values:
    upstream:
      allowAdHocKialiImage: true  # Allow custom image override
      image:
        repo: quay.io/kiali/kiali-operator
      cr:
        spec:
          deployment:
            image_name: quay.io/kiali/kiali

# Standalone Grafana
grafana:
  enabled: true
  values:
    global:
      imageRegistry: ""  # Disable registry prepending
    istio:
      grafana:
        hosts:
          - grafana-on-prem.zavestudios.com  # Single-level subdomain for free SSL
    upstream:
      image:
        registry: docker.io
        repository: grafana/grafana
        tag: "12.3.1"
      sidecar:
        image:
          registry: quay.io
          repository: kiwigrid/k8s-sidecar
          tag: "2.2.3"
      initChownData:
        enabled: false
      grafana.ini:
        server:
          root_url: https://grafana-on-prem.zavestudios.com

# Tempo - distributed tracing (disabled due to x86-64-v2 CPU requirement incompatibility)
tempo:
  enabled: false
  values:
    upstream:
      tempo:
        registry: docker.io
        repository: grafana/tempo

# Alloy - unified observability collector
alloy:
  enabled: true
  values:
    global:
      imageRegistry: ""  # Disable top-level registry prepending
    upstream:
      alloy-operator:
        waitForAlloyRemoval:
          image:
            registry: ghcr.io
            repository: grafana/helm-chart-toolbox-kubectl
            tag: "0.1.2"
        image:
          registry: ghcr.io
          repository: grafana/alloy-operator
          tag: "1.5.2"
        configReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
            tag: "v0.77.2"
      alloy-logs:
        image:
          registry: docker.io
          repository: grafana/alloy
          tag: "v1.12.2"
        configReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
            tag: "v0.77.2"
      destinations:
        - name: loki
          type: loki
          url: http://logging-loki.logging.svc.cluster.local:3100/loki/api/v1/push

# Loki - log aggregation storage
loki:
  enabled: true
  values:
    loki:
      image:
        registry: docker.io
        repository: grafana/loki
        tag: "3.5.7"
