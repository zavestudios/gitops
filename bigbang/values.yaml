# Big Bang values for on-prem environment
# Clean configuration using post-renderers for image rewrites

# Domain configuration
# Using root domain for on-prem environment hostnames
domain: zavestudios.com

# Disable packages requiring Iron Bank access
gatekeeper:
  enabled: false

# bbctl - disabled per vault-migration-plan.md decision
# Flux + ArgoCD already provide GitOps control plane
bbctl:
  enabled: false

kyverno:
  enabled: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              namespace: kyverno
              name: kyverno-background-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-background-controller
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
          - target:
              group: apps
              version: v1
              kind: Deployment
              namespace: kyverno
              name: kyverno-cleanup-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-cleanup-controller
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
          - target:
              group: apps
              version: v1
              kind: Deployment
              namespace: kyverno
              name: kyverno-reports-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-reports-controller
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
  flux:
    install:
      replace: true  # Force fresh install, ignore phantom state
  values:
    global:
      image:
        registry: ""  # Prevent registry prepending
    upstream:
      admissionController:
        container:
          image:
            defaultRegistry: ghcr.io
            repository: kyverno/kyverno
            tag: v1.16.3
        initContainer:
          image:
            defaultRegistry: ghcr.io
            repository: kyverno/kyvernopre
            tag: v1.16.3
      backgroundController:
        image:
          defaultRegistry: ghcr.io
          repository: kyverno/background-controller
          tag: v1.16.3
      cleanupController:
        image:
          defaultRegistry: ghcr.io
          repository: kyverno/cleanup-controller
          tag: v1.16.3
      reportsController:
        image:
          defaultRegistry: ghcr.io
          repository: kyverno/reports-controller
          tag: v1.16.3
      crds:
        migration:
          image:
            defaultRegistry: ghcr.io
            repository: kyverno/kyverno-cli
            tag: v1.16.3
      webhooksCleanup:
        image:
          registry: registry.k8s.io
          repository: kubectl
          tag: v1.34.3

kyvernoReporter:
  enabled: true
  values:
    istio:
      kyvernoReporter:
        hosts:
          - policyreporter-on-prem.zavestudios.com
    upstream:
      image:
        registry: ghcr.io
        repository: kyverno/policy-reporter
        tag: "3.7.2"
      ui:
        enabled: true
        image:
          registry: ghcr.io
          repository: kyverno/policy-reporter-ui
          tag: "2.5.1"
      plugin:
        kyverno:
          enabled: true
          image:
            registry: ghcr.io
            repository: kyverno/policy-reporter/kyverno-plugin
            tag: "0.5.3"

kyvernoPolicies:
  enabled: true
  values:
    waitJob:
      enabled: false  # Disable wait job - gluon uses hardcoded Iron Bank kubectl image
    bbtests:
      enabled: false  # Disable tests
      scripts:
        image: registry.k8s.io/kubectl:v1.34.3
    policies:
      restrict-image-registries:
        parameters:
          allow:
            - registry1.dso.mil/  # Iron Bank (for reference)
            - ghcr.io/            # GitHub Container Registry
            - quay.io/            # Red Hat Quay
            - docker.io/          # Docker Hub
            - index.docker.io/    # Docker Hub canonical hostname
            - registry.k8s.io/    # Kubernetes registry
            - public.ecr.aws/     # AWS Public ECR
        exclude:
          any:
            - resources:
                namespaces:
                  - alloy
                names:
                  - alloy-upstream-add-finalizer*
      disallow-auto-mount-service-account-token:
        exclude:
          any:
            - resources:
                namespaces:
                  - alloy
                names:
                  - alloy-upstream-add-finalizer*
            - resources:
                namespaces:
                  - alloy
                kinds:
                  - Deployment
                names:
                  - alloy-receiver
            - resources:
                namespaces:
                  - alloy
                kinds:
                  - ServiceAccount
                names:
                  - alloy-upstream-add-finalizer

eckOperator:
  enabled: false

elasticsearchKibana:
  enabled: false

fluentbit:
  enabled: false

neuvector:
  enabled: false

twistlock:
  enabled: false

# Istio - enabled with public images via values overrides
istioCRDs:
  enabled: true

istiod:
  enabled: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              namespace: istio-system
              name: istiod
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: istiod
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
  flux:
    install:
      disableHooks: true
    upgrade:
      disableHooks: true
  values:
    upstream:
      global:
        hub: docker.io/istio
        tag: 1.28.3

istioGateway:
  enabled: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: ServiceAccount
              namespace: istio-gateway
              name: public-ingressgateway-ingressgateway-service-account
            patch: |
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: public-ingressgateway-ingressgateway-service-account
              automountServiceAccountToken: false
  flux:
    install:
      disableHooks: true
    upgrade:
      disableHooks: true
  values:
    gateways:
      public:
        gateway:
          servers:
          - hosts:
            - '*.zavestudios.com'
            port:
              name: http
              number: 8080
              protocol: HTTP
            tls:
              httpsRedirect: false  # Cloudflare Tunnel terminates TLS
        upstream:
          global:
            hub: docker.io/istio
            tag: 1.28.3
      passthrough: {}  # Disabled - empty config

# Addons
addons:
  gitlab:
    enabled: false
  gitlabRunner:
    enabled: false

  externalSecrets:
    enabled: true
    postRenderers:
      - kustomize:
          patches:
            - target:
                group: apps
                version: v1
                kind: Deployment
                namespace: external-secrets
                name: external-secrets
              patch: |
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: external-secrets
                spec:
                  template:
                    metadata:
                      labels:
                        app.kubernetes.io/version: "1.2.1"
    values:
      waitJob: false
      upstream:
        podLabels:
          vault-ingress: "true"
        image:
          repository: ghcr.io/external-secrets/external-secrets
          tag: v1.2.1
        imagePullSecrets: []
        webhook:
          image:
            repository: ghcr.io/external-secrets/external-secrets
            tag: v1.2.1
          imagePullSecrets: []
        certController:
          image:
            repository: ghcr.io/external-secrets/external-secrets
            tag: v1.2.1
          imagePullSecrets: []

  vault:
    enabled: true
    postRenderers:
      - kustomize:
          patches:
            - target:
                group: networking.istio.io
                version: v1
                kind: VirtualService
                namespace: keycloak
                name: keycloak
              patch: |
                - op: remove
                  path: /spec/tls
            - target:
                group: apps
                version: v1
                kind: StatefulSet
                namespace: vault
                name: vault-vault
              patch: |
                apiVersion: apps/v1
                kind: StatefulSet
                metadata:
                  name: vault-vault
                spec:
                  template:
                    spec:
                      automountServiceAccountToken: false
    values:
      global:
        imageRegistry: ""  # Disable registry prepending
      istio:
        vault:
          hosts:
            - vault-on-prem.zavestudios.com
      autoInit:
        enabled: false  # Disable auto-init job (requires Iron Bank, not for production)
      upstream:
        server:
          ha:
            apiAddr: "http://vault.vault.svc.cluster.local:8200"
          image:
            repository: docker.io/hashicorp/vault
            tag: 1.21.2
          standalone:
            config: |
              ui = true
              api_addr = "http://vault.vault.svc.cluster.local:8200"

              seal "awskms" {
                region     = "us-west-2"
                kms_key_id = "alias/zavestudios-onprem-vault-auto-unseal"
              }

              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }

              telemetry {
                prometheus_retention_time = "24h"
                disable_hostname = true
                unauthenticated_metrics_access = true
              }

              storage "file" {
                path = "/vault/data"
              }
          # Security: disable automount of service account token
          serviceAccount:
            create: true
            automountServiceAccountToken: false
          extraSecretEnvironmentVars:
            - envName: AWS_ACCESS_KEY_ID
              secretName: vault-aws-auto-unseal
              secretKey: AWS_ACCESS_KEY_ID
            - envName: AWS_SECRET_ACCESS_KEY
              secretName: vault-aws-auto-unseal
              secretKey: AWS_SECRET_ACCESS_KEY
          # Add required labels for Kyverno policies
          statefulSet:
            annotations:
              kyverno.io/ignore: "false"
          extraLabels:
            app.kubernetes.io/version: "1.21.2"
        injector:
          enabled: false  # Disabled - conflicts with Kyverno, prefer External Secrets Operator
          image:
            repository: docker.io/hashicorp/vault-k8s
            tag: 1.7.3
          agentImage:
            repository: docker.io/hashicorp/vault
            tag: 1.21.2
          # Security: disable automount of service account token
          authDelegator:
            enabled: false  # Disable if not using auth delegation
          serviceAccount:
            create: true
          automountServiceAccountToken: false  # Pod-level setting
          extraLabels:
            app.kubernetes.io/version: "1.7.3"
        csi:
          enabled: false  # Disable CSI provider if not needed
          image:
            repository: docker.io/hashicorp/vault-csi-provider
            tag: 1.7.0
          # Security: disable automount of service account token
          serviceAccount:
            create: true
          automountServiceAccountToken: false  # Pod-level setting
          extraLabels:
            app.kubernetes.io/version: "1.7.0"

  keycloak:
    enabled: true
    hostname: sso-on-prem  # Overrides default 'keycloak' prefix → sso-on-prem.zavestudios.com
    ingress:
      gateway: "public"
      cert: ""
      key: ""
    values:
      postgresql:
        enabled: false  # Disable embedded PostgreSQL dependency; use external DB instead
      global:
        imageRegistry: ""  # Disable registry prepending
      istio:
        keycloak:
          hosts:
            - sso-on-prem.zavestudios.com
      upstream:
        image:
          repository: ghcr.io/zavestudios/keycloak
          tag: bootstrap
        podLabels:
          app.kubernetes.io/version: "26.4.7"
        automountServiceAccountToken: false
        serviceAccount:
          automountServiceAccountToken: false
        args:
          - start
          - --optimized
          - --http-enabled=true
          - --proxy-headers=forwarded
          - --hostname=https://sso-on-prem.zavestudios.com/auth
          - --hostname-strict=false
        replicas: 1
        # External PostgreSQL connection
        database:
          vendor: postgres
          hostname: "192.168.122.20"
          port: 5432
          database: "db_keycloak"
          username: "keycloak_app"
          existingSecret: "keycloak-postgres-credentials"
          existingSecretKey: "KC_DB_PASSWORD"
        # These string-valued upstream fields replace Big Bang defaults wholesale.
        # Include every secret and mount we need in a single override block.
        extraEnvFrom: |
          - secretRef:
              name: keycloak-postgres-credentials
          - secretRef:
              name: keycloak-admin-credentials
        extraVolumes: |
          - name: keycloak-data
            emptyDir: {}
          - name: tmp
            emptyDir: {}
        extraVolumeMounts: |
          - name: keycloak-data
            mountPath: /opt/keycloak/data
          - name: tmp
            mountPath: /tmp
    postRenderers:
      - kustomize:
          patches:
            - target:
                group: apps
                version: v1
                kind: StatefulSet
                namespace: keycloak
                labelSelector: app.kubernetes.io/instance=keycloak
              patch: |
                apiVersion: apps/v1
                kind: StatefulSet
                metadata:
                  name: not-used
                spec:
                  template:
                    spec:
                      automountServiceAccountToken: false
                      imagePullSecrets:
                        - name: private-registry
            - target:
                group: apps
                version: v1
                kind: Deployment
                namespace: keycloak
                labelSelector: app.kubernetes.io/instance=keycloak
              patch: |
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: not-used
                spec:
                  template:
                    spec:
                      automountServiceAccountToken: false
                      imagePullSecrets:
                        - name: private-registry

  argocd:
    enabled: true
    postRenderers:
      - kustomize:
          patches:
            - target:
                group: apps
                version: v1
                kind: Deployment
                namespace: argocd
                labelSelector: app.kubernetes.io/instance=argocd-argocd
              patch: |
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: not-used
                spec:
                  template:
                    spec:
                      automountServiceAccountToken: false
            - target:
                group: apps
                version: v1
                kind: StatefulSet
                namespace: argocd
                labelSelector: app.kubernetes.io/instance=argocd-argocd
              patch: |
                apiVersion: apps/v1
                kind: StatefulSet
                metadata:
                  name: not-used
                spec:
                  template:
                    spec:
                      automountServiceAccountToken: false
    values:
      istio:
        argocd:
          hosts:
            - argocd-on-prem.zavestudios.com
      upgradeJob:
        enabled: false  # Disable upgrade job to avoid Iron Bank image
      global:
        image:
          repository: quay.io/argoproj/argocd
      upstream:
        dex:
          image:
            repository: ghcr.io/dexidp/dex
      redis-bb:
        cleanUpgrade:
          enabled: false  # Disable clean upgrade job - uses Iron Bank kubectl image
        upstream:
          global:
            imageRegistry: ""
          image:
            registry: public.ecr.aws
            repository: docker/library/redis
          metrics:
            image:
              registry: ghcr.io
              repository: oliver006/redis_exporter
            command:
              - /redis_exporter

# Monitoring stack with public images via values overrides
monitoring:
  enabled: true
  values:
    istio:
      prometheus:
        hosts:
          - prometheus-on-prem.zavestudios.com
      alertmanager:
        hosts:
          - alertmanager-on-prem.zavestudios.com
    upstream:
      global:
        imageRegistry: ""  # Disable registry prepending
      prometheusOperator:
        serviceAccount:
          automountServiceAccountToken: false
        image:
          registry: quay.io
          repository: prometheus-operator/prometheus-operator
        prometheusConfigReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
        admissionWebhooks:
          enabled: true
          patch:
            image:
              registry: registry.k8s.io
              repository: ingress-nginx/kube-webhook-certgen
              tag: v1.6.5
              pullPolicy: IfNotPresent
      prometheus:
        prometheusSpec:
          image:
            registry: quay.io
            repository: prometheus/prometheus
          serviceAccountName: prometheus-monitoring-monitoring-kube-prometheus
          # Prometheus needs Kubernetes API credentials for ServiceMonitor/PodMonitor discovery.
          automountServiceAccountToken: true
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 2Gi
              cpu: 1000m
          retention: 12h  # Reduce from 24h default to lower memory footprint
      alertmanager:
        alertmanagerSpec:
          image:
            registry: quay.io
            repository: prometheus/alertmanager
      prometheus-node-exporter:
        image:
          registry: quay.io
          repository: prometheus/node-exporter
      kube-state-metrics:
        automountServiceAccountToken: false
        image:
          registry: registry.k8s.io
          repository: kube-state-metrics/kube-state-metrics
      grafana:
        automountServiceAccountToken: false
        image:
          registry: docker.io
          repository: grafana/grafana
        sidecar:
          image:
            registry: quay.io
            repository: kiwigrid/k8s-sidecar

# Kiali - service mesh observability
kiali:
  enabled: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              namespace: kiali
              name: kiali-kiali-kiali-operator
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kiali-kiali-kiali-operator
              spec:
                template:
                  spec:
                    automountServiceAccountToken: false
  values:
    routes:
      inbound:
        kiali:
          hosts:
            - kiali-on-prem.zavestudios.com
    waitJob:
      enabled: false  # Disable wait job - gluon uses hardcoded Iron Bank kubectl image
    upstream:
      allowAdHocKialiImage: true  # Allow custom image override
      image:
        repo: quay.io/kiali/kiali-operator
      cr:
        spec:
          deployment:
            image_name: quay.io/kiali/kiali

# Standalone Grafana
grafana:
  enabled: true
  values:
    global:
      imageRegistry: ""  # Disable registry prepending
    istio:
      grafana:
        hosts:
          - grafana-on-prem.zavestudios.com  # Single-level subdomain for free SSL
    upstream:
      image:
        registry: docker.io
        repository: grafana/grafana
        tag: "12.3.1"
      sidecar:
        image:
          registry: quay.io
          repository: kiwigrid/k8s-sidecar
          tag: "2.2.3"
      initChownData:
        enabled: false
      grafana.ini:
        server:
          root_url: https://grafana-on-prem.zavestudios.com

# Tempo - distributed tracing
tempo:
  enabled: true
  values:
    waitJob:
      enabled: false  # Disable wait job - gluon uses hardcoded Iron Bank kubectl image
    upstream:
      tempo:
        registry: docker.io
        repository: grafana/tempo

# Alloy - unified observability collector
alloy:
  enabled: true
  flux:
    install:
      disableHooks: true
    upgrade:
      disableHooks: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              namespace: alloy
              name: alloy-alloy-operator
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: alloy-alloy-operator
              spec:
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/version: "1.5.2"
                  spec:
                    automountServiceAccountToken: false
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              namespace: alloy
              name: alloy-alloy-logs
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: alloy-alloy-logs
              spec:
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/version: "v1.12.2"
          - target:
              group: batch
              version: v1
              kind: Job
              namespace: alloy
              name: alloy-upstream-add-finalizer
            patch: |
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: alloy-upstream-add-finalizer
              spec:
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/version: "0.1.2"
                      sidecar.istio.io/inject: "true"
                    annotations:
                      sidecar.istio.io/inject: "true"
                  spec:
                    automountServiceAccountToken: false
                    imagePullSecrets: []
                    volumes:
                      - name: k8s-api-access
                        projected:
                          defaultMode: 420
                          sources:
                            - serviceAccountToken:
                                audience: https://kubernetes.default.svc
                                expirationSeconds: 3600
                                path: token
                            - configMap:
                                items:
                                  - key: ca.crt
                                    path: ca.crt
                                name: kube-root-ca.crt
                            - downwardAPI:
                                items:
                                  - fieldRef:
                                      apiVersion: v1
                                      fieldPath: metadata.namespace
                                    path: namespace
                    containers:
                      - name: add-finalizers
                        image: ghcr.io/grafana/helm-chart-toolbox-kubectl:0.1.2
                        volumeMounts:
                          - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                            name: k8s-api-access
                            readOnly: true
                    serviceAccountName: alloy-upstream-add-finalizer
          - target:
              group: v1
              version: v1
              kind: ServiceAccount
              namespace: alloy
              name: alloy-upstream-add-finalizer
            patch: |
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: alloy-upstream-add-finalizer
                labels:
                  app.kubernetes.io/version: "0.1.2"
              automountServiceAccountToken: false
  values:
    alloy-operator:
      waitForAlloyRemoval:
        image:
          registry: ghcr.io
          repository: grafana/helm-chart-toolbox-kubectl
          tag: "0.1.2"
        podAnnotations:
          sidecar.istio.io/inject: "true"
        podLabels:
          sidecar.istio.io/inject: "true"
    applicationObservability:
      enabled: true
      collector: alloy-receiver
      receivers:
        otlp:
          grpc:
            enabled: true
            port: 4317
          http:
            enabled: true
            port: 4318
    global:
      imageRegistry: ""  # Disable top-level registry prepending
      imagePullSecrets: []
      image:
        registry: ""
        pullSecrets: []
    collectors:
      alloy-receiver:
        presets:
          - deployment
    k8s-monitoring:
      alloy-logs:
        image:
          registry: docker.io
          repository: grafana/alloy
          tag: "v1.12.2"
        configReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
            tag: "v0.77.2"
      alloy-operator:
        waitForAlloyRemoval:
          image:
            registry: ghcr.io
            repository: grafana/helm-chart-toolbox-kubectl
            tag: "0.1.2"
        image:
          registry: ghcr.io
          repository: grafana/alloy-operator
          tag: "1.5.2"
        configReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
            tag: "v0.77.2"
      alloy-metrics:
        image:
          registry: docker.io
          repository: grafana/alloy
          tag: "v1.12.2"
        configReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
            tag: "v0.77.2"
      alloy-receiver:
        image:
          registry: docker.io
          repository: grafana/alloy
          tag: "v1.12.2"
        configReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
            tag: "v0.77.2"
      integrations:
        alloy:
          image:
            registry: docker.io
            repository: grafana/alloy
            tag: "v1.12.2"
    upstream:
      alloy-operator:
        waitForAlloyRemoval:
          image:
            registry: ghcr.io
            repository: grafana/helm-chart-toolbox-kubectl
            tag: "0.1.2"
        image:
          registry: ghcr.io
          repository: grafana/alloy-operator
          tag: "1.5.2"
        configReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
            tag: "v0.77.2"
      alloy-logs:
        image:
          registry: docker.io
          repository: grafana/alloy
          tag: "v1.12.2"
        configReloader:
          image:
            registry: quay.io
            repository: prometheus-operator/prometheus-config-reloader
            tag: "v0.77.2"
      destinations:
        - name: loki
          type: loki
          url: http://logging-loki.logging.svc.cluster.local:3100/loki/api/v1/push
        - name: tempo
          type: otlp
          protocol: grpc
          url: tempo-tempo.tempo.svc.cluster.local:4317
          traces:
            enabled: true

