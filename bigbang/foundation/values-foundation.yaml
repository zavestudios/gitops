                metadata:
                  name: not-used
                spec:
                  template:
                    metadata:
                      annotations:
                        sidecar.istio.io/inject: "false"
                    spec:
                      automountServiceAccountToken: false
                      securityContext:
                        runAsNonRoot: true
                        runAsUser: 999
                        runAsGroup: 999
                        seccompProfile:
                          type: RuntimeDefault
            - target:
                group: apps
                version: v1
                kind: StatefulSet
                namespace: argocd
                labelSelector: app.kubernetes.io/instance=argocd-argocd
              patch: |
                apiVersion: apps/v1
                kind: StatefulSet
                metadata:
                  name: not-used
                spec:
                  template:
                    metadata:
                      annotations:
                        sidecar.istio.io/inject: "false"
                    spec:
                      automountServiceAccountToken: false
                      securityContext:
                        runAsNonRoot: true
                        runAsUser: 999
                        runAsGroup: 999
                        seccompProfile:
                          type: RuntimeDefault
            - target:
                group: apps
                version: v1
                kind: Deployment
                namespace: argocd
                name: argocd-argocd-applicationset-controller
              patch: |
                - op: add
                  path: /spec/template/spec/automountServiceAccountToken
                  value: false
                - op: add
                  path: /spec/template/spec/securityContext
                  value:
                    runAsNonRoot: true
                    runAsUser: 999
                    runAsGroup: 999
                    seccompProfile:
                      type: RuntimeDefault
                - op: add
                  path: /spec/template/spec/containers/0/securityContext
                  value:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                - op: add
                  path: /spec/template/spec/volumes/-
                  value:
                    name: k8s-api-access
                    projected:
                      defaultMode: 420
                      sources:
                        - serviceAccountToken:
                            audience: https://kubernetes.default.svc.cluster.local
                            expirationSeconds: 3600
                            path: token
                        - configMap:
                            items:
                              - key: ca.crt
                                path: ca.crt
                            name: kube-root-ca.crt
                        - downwardAPI:
