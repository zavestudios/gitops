monitoring:
  enabled: false

# Kiali remains with foundation in the first split because it is tightly tied to
# mesh topology and ingress behavior.
kiali:
  enabled: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              namespace: kiali
              name: kiali-kiali-kiali-operator
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kiali-kiali-kiali-operator
              spec:
                template:
                  spec:
                    automountServiceAccountToken: true
  values:
    routes:
      inbound:
        kiali:
          hosts:
            - kiali-on-prem.zavestudios.com
    waitJob:
      enabled: false
    upstream:
      allowAdHocKialiImage: true
      image:
        repo: quay.io/kiali/kiali-operator
      cr:
        spec:
          deployment:
            image_name: quay.io/kiali/kiali

grafana:
  enabled: false

tempo:
  enabled: false

alloy:
  enabled: false

loki:
  enabled: false
