---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: bigbang
spec:
  dependsOn:
    - name: minio-operator
      namespace: bigbang
  interval: 10m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: minio
        namespace: bigbang
      interval: 10m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: bigbang-minio-values
      valuesKey: values.yaml
