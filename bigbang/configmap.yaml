---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bigbang-values
  namespace: bigbang
data:
  values.yaml: |
    # Big Bang values for sandbox environment
    # Minimal scope: Istio + ArgoCD + Monitoring
    # Disable packages requiring Iron Bank access

    # MECHANIC'S NOTE: `enabled=true` causes the BigBang umbrella chart to emit a HelmRelease for the package. 

    # Domain configuration - routed via Cloudflare Tunnel
    domain: sandbox.zavestudios.com

    # Disable policy/security packages (require Iron Bank)
    gatekeeper:
      enabled: false

    kyverno:
      enabled: false

    kyvernoPolicies:
      enabled: false

    # Disable logging stack (require Iron Bank)
    eckOperator:
      enabled: false

    elasticsearchKibana:
      enabled: false

    fluentbit:
      enabled: false

    loki:
      enabled: false

    # Disable security scanning (require Iron Bank)
    neuvector:
      enabled: false

    twistlock:
      enabled: false

    # Enable Istio with public images (NEW structure for Big Bang 3.x)
    istioCRDs:
      enabled: true

    istiod:
      enabled: true
      flux:
        install:
          disableHooks: true
        upgrade:
          disableHooks: true
      values:
        upstream:
          global:
            hub: docker.io/istio
            tag: 1.28.3

    istioGateway:
      enabled: true
      flux:
        install:
          disableHooks: true
        upgrade:
          disableHooks: true
      values:
        gateways:
          public:
            upstream:
              global:
                hub: docker.io/istio
                tag: 1.28.3
          passthrough: {}  # Disable passthrough gateway

    # Addons
    addons:
      gitlab:
        enabled: false
      gitlabRunner:
        enabled: false
      argocd:
        enabled: true
        values:
          upstream:
            # Override Iron Bank images with public images
            global:
              image:
                repository: quay.io/argoproj/argocd
                tag: v2.10.0
            dex:
              image:
                repository: quay.io/dexidp/dex
                tag: v2.37.0
            redis:
              image:
                repository: docker.io/redis
                tag: "7.0"

    # Monitoring stack with public images
    monitoring:
      enabled: true
      values:
        upstream:
          # Override Iron Bank images with public images
          prometheusOperator:
            image:
              registry: quay.io
              repository: prometheus-operator/prometheus-operator
              tag: v0.77.1
            prometheusConfigReloader:
              image:
                registry: quay.io
                repository: prometheus-operator/prometheus-config-reloader
                tag: v0.77.1
            thanosImage:
              registry: quay.io
              repository: thanos/thanos
              tag: v0.36.1
            admissionWebhooks:
              patch:
                image:
                  registry: registry.k8s.io
                  repository: ingress-nginx/kube-webhook-certgen
                  tag: v1.4.3
          prometheus:
            prometheusSpec:
              image:
                registry: docker.io
                repository: prom/prometheus
                tag: v2.50.0
          prometheus-node-exporter:
            image:
              registry: quay.io
              repository: prometheus/node-exporter
              tag: v1.8.2
          alertmanager:
            alertmanagerSpec:
              image:
                registry: docker.io
                repository: prom/alertmanager
                tag: v0.27.0
          grafana:
            image:
              registry: docker.io
              repository: grafana/grafana
              tag: 10.3.0

    # Service mesh observability
    kiali:
      enabled: true
      values:
        upstream:
          deployment:
            image_name: quay.io/kiali/kiali
            image_version: v1.79.0
