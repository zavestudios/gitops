---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bigbang-values
  namespace: bigbang
data:
  values.yaml: |
    # Big Bang values for sandbox environment
    # Minimal scope: Istio + ArgoCD + Monitoring
    # Disable packages requiring Iron Bank access

    # MECHANIC'S NOTE: `enabled=true` causes the BigBang umbrella chart to emit a HelmRelease for the package. 

    # Domain configuration - routed via Cloudflare Tunnel
    domain: sandbox.zavestudios.com

    # Disable policy/security packages (require Iron Bank)
    gatekeeper:
      enabled: false

    kyverno:
      enabled: false

    kyvernoPolicies:
      enabled: false

    # Disable logging stack (require Iron Bank)
    eckOperator:
      enabled: false

    elasticsearchKibana:
      enabled: false

    fluentbit:
      enabled: false

    loki:
      enabled: false

    # Disable security scanning (require Iron Bank)
    neuvector:
      enabled: false

    twistlock:
      enabled: false

    # Enable Istio with public images (NEW structure for Big Bang 3.x)
    istioCRDs:
      enabled: true

    istiod:
      enabled: true
      flux:
        install:
          disableHooks: true
        upgrade:
          disableHooks: true
      values:
        upstream:
          global:
            hub: docker.io/istio
            tag: 1.28.3

    istioGateway:
      enabled: true
      flux:
        install:
          disableHooks: true
        upgrade:
          disableHooks: true
      values:
        gateways:
          public:
            upstream:
              global:
                hub: docker.io/istio
                tag: 1.28.3
          passthrough: {}  # Disable passthrough gateway

    # Addons
    addons:
      gitlab:
        enabled: false
      gitlabRunner:
        enabled: false
      argocd:
        enabled: true
        values:
          upstream:
            # Override Iron Bank images with public images - must specify each component
            controller:
              image:
                repository: quay.io/argoproj/argocd
                tag: v2.12.0
            server:
              image:
                repository: quay.io/argoproj/argocd
                tag: v2.12.0
            repoServer:
              image:
                repository: quay.io/argoproj/argocd
                tag: v2.12.0
            applicationSet:
              image:
                repository: quay.io/argoproj/argocd
                tag: v2.12.0
            notifications:
              image:
                repository: quay.io/argoproj/argocd
                tag: v2.12.0
            dex:
              image:
                repository: quay.io/dexidp/dex
                tag: v2.38.0
            redis-bb:
              image:
                repository: docker.io/redis
                tag: "7.4"
              metrics:
                enabled: true
                image:
                  repository: docker.io/oliver006/redis_exporter
                  tag: v1.62.0

    # Monitoring stack with public images
    monitoring:
      enabled: true
      values:
        upstream:
          # Override Iron Bank images with public images
          prometheusOperator:
            image:
              registry: quay.io
              repository: prometheus-operator/prometheus-operator
              tag: v0.77.1
            prometheusConfigReloader:
              image:
                registry: quay.io
                repository: prometheus-operator/prometheus-config-reloader
                tag: v0.77.1
            thanosImage:
              registry: quay.io
              repository: thanos/thanos
              tag: v0.36.1
            admissionWebhooks:
              patch:
                image:
                  registry: registry.k8s.io
                  repository: ingress-nginx/kube-webhook-certgen
                  tag: v1.4.3
          prometheus:
            prometheusSpec:
              image:
                registry: docker.io
                repository: prom/prometheus
                tag: v2.50.0
          prometheus-node-exporter:
            image:
              registry: quay.io
              repository: prometheus/node-exporter
              tag: v1.8.2
          kube-state-metrics:
            image:
              registry: registry.k8s.io
              repository: kube-state-metrics/kube-state-metrics
              tag: v2.13.0
          alertmanager:
            alertmanagerSpec:
              image:
                registry: docker.io
                repository: prom/alertmanager
                tag: v0.27.0
          grafana:
            image:
              registry: docker.io
              repository: grafana/grafana
              tag: 11.4.0
            initChownData:
              enabled: false
            sidecar:
              image:
                registry: quay.io
                repository: kiwigrid/k8s-sidecar
                tag: 1.28.0

    # Service mesh observability
    kiali:
      enabled: true
      values:
        upstream:
          image:
            repo: quay.io/kiali/kiali-operator
            tag: v2.21.0
          cr:
            spec:
              deployment:
                image_name: quay.io/kiali/kiali
                image_version: v1.89.0

    # Standalone Grafana (separate from monitoring)
    grafana:
      enabled: true
      values:
        upstream:
          image:
            repository: docker.io/grafana/grafana
            tag: 11.4.0
          initChownData:
            enabled: false
          sidecar:
            image:
              repository: quay.io/kiwigrid/k8s-sidecar
              tag: 1.28.0

    # Tempo distributed tracing
    tempo:
      enabled: true
      values:
        upstream:
          tempo:
            image:
              repository: docker.io/grafana/tempo
              tag: 2.6.0
