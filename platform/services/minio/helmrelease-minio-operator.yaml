---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-operator
  namespace: platform
spec:
  interval: 10m
  targetNamespace: minio-operator
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: operator
      version: 7.1.1
      sourceRef:
        kind: HelmRepository
        name: minio-operator
        namespace: platform
      interval: 10m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    operator:
      image:
        repository: quay.io/minio/operator
        tag: v7.1.1
      sidecarImage:
        repository: quay.io/minio/operator-sidecar
        tag: v7.1.0
