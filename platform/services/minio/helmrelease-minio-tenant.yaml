---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-tenant
  namespace: platform
spec:
  dependsOn:
    - name: minio-operator
      namespace: platform
  interval: 10m
  targetNamespace: minio
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: tenant
      version: 7.1.1
      sourceRef:
        kind: HelmRepository
        name: minio-operator
        namespace: platform
      interval: 10m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    tenant:
      name: listings-ingest-tenant
      image:
        repository: docker.io/minio/minio
        tag: RELEASE.2025-09-07T16-13-09Z
      imagePullSecrets: []
      pools:
        - name: pool-0
          servers: 1
          volumesPerServer: 1
          size: 10Gi
          storageClassName: local-path
      buckets:
        - name: listings-ingest
      configSecret:
        name: minio-root-credentials
        existingSecret: true
