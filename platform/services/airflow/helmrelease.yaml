apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: platform
  labels:
    zave.io/workload: airflow
spec:
  interval: 10m
  timeout: 20m
  chart:
    spec:
      chart: airflow
      version: 1.15.0
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
        namespace: platform
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Explicit registry prefix required for Kyverno restrict-image-registries policy
    defaultAirflowRepository: docker.io/apache/airflow
    defaultAirflowTag: "2.9.3-python3.11"

    # Executor configuration
    executor: KubernetesExecutor

    # Environment configuration
    env:
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: AIRFLOW__CORE__LOAD_EXAMPLES
        value: "False"
      - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
        value: "True"
      - name: AIRFLOW_RUN_NAMESPACE
        value: "listings-ingest"
      - name: ETL_IMAGE
        value: "ghcr.io/zavestudios/zavestudios-etl-runner@sha256:f7ef312a5db7379af01c0dcbbaf789373465434621a73454edd26bfaeaa42dff"

    # External PostgreSQL configuration
    postgresql:
      enabled: false

    data:
      metadataSecretName: airflow-db

    # Fernet key for encryption
    fernetKeySecretName: airflow-fernet

    # Webserver secret key for Flask session signing
    webserverSecretKeySecretName: airflow-webserver-secret-key

    # Web server configuration
    webserver:
      replicas: 1
      startupProbe:
        failureThreshold: 24
        periodSeconds: 10
        timeoutSeconds: 30
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      service:
        type: ClusterIP
        ports:
          - name: http
            port: 8080
    # Scheduler configuration
    scheduler:
      replicas: 1
      startupProbe:
        timeoutSeconds: 60
        failureThreshold: 24
        periodSeconds: 10
      livenessProbe:
        timeoutSeconds: 60
        failureThreshold: 5
        periodSeconds: 60
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      logGroomerSidecar:
        enabled: false

    # Triggerer configuration (for deferrable operators)
    triggerer:
      enabled: true
      replicas: 1
      livenessProbe:
        timeoutSeconds: 60
        failureThreshold: 5
        periodSeconds: 60
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      logGroomerSidecar:
        enabled: false

    # StatsD does not inherit the chart's global security contexts.
    statsd:
      securityContexts:
        pod:
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          fsGroup: 65534
        container:
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            add: []
            drop:
              - ALL

    # DAG git-sync configuration
    dags:
      gitSync:
        enabled: true
        repo: https://github.com/zavestudios/listings-ingest
        branch: main
        subPath: dags
        wait: 60
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContexts:
          container:
            runAsUser: 50000
            runAsGroup: 50000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              add: []
              drop:
                - ALL

    # KubernetesPodOperator configuration
    config:
      kubernetes:
        namespace: platform
        worker_container_repository: docker.io/apache/airflow
        worker_container_tag: 2.9.3-python3.11
        delete_worker_pods: "True"
        delete_worker_pods_on_failure: "False"

    # RBAC for cross-namespace pod creation
    rbac:
      create: true
      createSCCRoleBinding: false

    serviceAccount:
      create: true
      name: airflow

    # Security contexts
    # readOnlyRootFilesystem is omitted: the chart does not propagate global
    # extraVolumeMounts to Jobs and sidecars consistently, so every airflow
    # component hits EROFS when initialising logging or airflow.cfg.
    # Re-evaluate with per-component volume mounts in a hardening pass.
    securityContexts:
      pod:
        runAsUser: 50000
        runAsGroup: 50000
        runAsNonRoot: true
        fsGroup: 50000
      containers:
        runAsUser: 50000
        runAsGroup: 50000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          add: []
          drop:
            - ALL

    # Volumes for writable paths
    extraVolumes:
      - name: tmp
        emptyDir: {}
      - name: airflow-home
        emptyDir: {}

    extraVolumeMounts:
      - name: tmp
        mountPath: /tmp
      - name: airflow-home
        mountPath: /opt/airflow
