apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: platform
  labels:
    zave.io/workload: airflow
spec:
  interval: 10m
  timeout: 20m
  chart:
    spec:
      chart: airflow
      version: 1.15.0
      sourceRef:
        kind: HelmRepository
        name: apache-airflow
        namespace: platform
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Explicit registry prefix required for Kyverno restrict-image-registries policy
    defaultAirflowRepository: docker.io/apache/airflow
    defaultAirflowTag: "2.9.3-python3.11"

    # Executor configuration
    executor: KubernetesExecutor

    # Environment configuration
    env:
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: AIRFLOW__CORE__LOAD_EXAMPLES
        value: "False"
      - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
        value: "True"

    # External PostgreSQL configuration
    postgresql:
      enabled: false

    data:
      metadataSecretName: airflow-db

    # Fernet key for encryption
    fernetKeySecretName: airflow-fernet

    # Webserver secret key for Flask session signing
    webserverSecretKeySecretName: airflow-webserver-secret-key

    # Web server configuration
    webserver:
      replicas: 1
      startupProbe:
        failureThreshold: 24
        periodSeconds: 10
        timeoutSeconds: 30
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      service:
        type: ClusterIP
        ports:
          - name: http
            port: 8080
      securityContexts:
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      waitForMigrations:
        securityContexts:
          container:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

    # Scheduler configuration
    scheduler:
      replicas: 1
      startupProbe:
        timeoutSeconds: 60
        failureThreshold: 24
        periodSeconds: 10
      livenessProbe:
        timeoutSeconds: 60
        failureThreshold: 5
        periodSeconds: 60
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      securityContexts:
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      waitForMigrations:
        securityContexts:
          container:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

    # Triggerer configuration (for deferrable operators)
    triggerer:
      enabled: true
      replicas: 1
      startupProbe:
        timeoutSeconds: 60
        failureThreshold: 24
        periodSeconds: 10
      livenessProbe:
        timeoutSeconds: 60
        failureThreshold: 5
        periodSeconds: 60
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      securityContexts:
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      waitForMigrations:
        securityContexts:
          container:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      # logGroomerSidecar does not inherit global extraVolumeMounts; mount explicitly
      # readOnlyRootFilesystem must be false here because the sidecar runs `airflow`
      # which writes airflow.cfg to AIRFLOW_HOME (/opt/airflow) on startup
      logGroomerSidecar:
        extraVolumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: airflow-home
            mountPath: /opt/airflow
        securityContexts:
          container:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false

    # DAG git-sync configuration
    dags:
      gitSync:
        enabled: true
        repo: https://github.com/zavestudios/listings-ingest
        branch: main
        subPath: dags
        wait: 60
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContexts:
          container:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

    # KubernetesPodOperator configuration
    config:
      kubernetes:
        namespace: platform
        worker_container_repository: docker.io/apache/airflow
        worker_container_tag: 2.9.3-python3.11
        delete_worker_pods: "True"
        delete_worker_pods_on_failure: "False"

    # RBAC for cross-namespace pod creation
    rbac:
      create: true
      createSCCRoleBinding: false

    serviceAccount:
      create: true
      name: airflow

    # Security contexts
    securityContexts:
      pod:
        runAsUser: 50000
      containers:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

    # Volumes for writable paths
    extraVolumes:
      - name: tmp
        emptyDir: {}
      - name: airflow-home
        emptyDir: {}

    extraVolumeMounts:
      - name: tmp
        mountPath: /tmp
      - name: airflow-home
        mountPath: /opt/airflow