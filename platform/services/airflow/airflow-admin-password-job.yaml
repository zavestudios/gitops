apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-admin-password-set
  namespace: platform
  labels:
    zave.io/workload: airflow
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: airflow
      securityContext:
        runAsUser: 50000
        runAsNonRoot: true
      containers:
        - name: set-password
          image: docker.io/apache/airflow:2.9.3-python3.11
          command:
            - /bin/bash
            - -c
            - |
              airflow users delete --username "${ADMIN_USERNAME}" --yes 2>/dev/null || true
              airflow users create \
                --username "${ADMIN_USERNAME}" \
                --password "${ADMIN_PASSWORD}" \
                --role Admin \
                --email "admin@zavestudios.com" \
                --firstname Admin \
                --lastname User
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: airflow-db
                  key: connection
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-fernet
                  key: fernet-key
            - name: AIRFLOW__WEBSERVER__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-webserver-secret-key
                  key: webserver-secret-key
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-admin
                  key: password
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: airflow-admin
                  key: username
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: airflow-home
              mountPath: /opt/airflow
      volumes:
        - name: tmp
          emptyDir: {}
        - name: airflow-home
          emptyDir: {}