---
# ExternalSecret for KeyCloak database password
# Pulls password from Vault and creates a Kubernetes Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-postgres-credentials
  namespace: keycloak
  labels:
    zave.io/component: keycloak
    zave.io/tier: platform-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: keycloak-postgres-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KC_DB_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: platform/services/keycloak/db

---
# ExternalSecret for KeyCloak admin credentials
# Pulls admin username and password from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin-credentials
  namespace: keycloak
  labels:
    zave.io/component: keycloak
    zave.io/tier: platform-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KEYCLOAK_ADMIN: "{{ .KEYCLOAK_ADMIN }}"
        KEYCLOAK_ADMIN_PASSWORD: "{{ .KEYCLOAK_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: platform/services/keycloak/admin
