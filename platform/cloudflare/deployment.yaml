apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: platform
  labels:
    app: cloudflared
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/version: "2024.12.2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app: cloudflared
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/version: "2024.12.2"
    spec:
      automountServiceAccountToken: false
      containers:
      - name: cloudflared
        image: docker.io/cloudflare/cloudflared:2024.12.2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - --credentials-file
        - /etc/cloudflared/creds/credentials.json
        - --no-autoupdate
        - run
        - 24ca1f2b-5a12-497b-bdb0-49496fde9bc8
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: cloudflared-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: creds
        secret:
          secretName: cloudflared-credentials
          items:
          - key: credentials.json
            path: credentials.json
