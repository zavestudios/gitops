apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: platform
data:
  config.yaml: |
    metrics: 0.0.0.0:2000

    ingress:
      # Route all traffic to Istio public gateway
      - service: http://public-ingressgateway.istio-gateway.svc.cluster.local:80
        originRequest:
          noTLSVerify: true
          httpHostHeader: ""
          # Forward protocol header so backend apps know request was HTTPS
          httpHeaders:
            X-Forwarded-Proto:
              - https
