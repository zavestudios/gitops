apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-alloy-receiver
  namespace: alloy
  labels:
    app.kubernetes.io/name: alloy-receiver
    app.kubernetes.io/part-of: alloy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-receiver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 12345
          protocol: TCP
