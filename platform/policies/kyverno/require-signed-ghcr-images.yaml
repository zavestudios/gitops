apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-ghcr-images
spec:
  validationFailureAction: Audit # change to Enforce after validation
  background: true
  rules:
    - name: verify-ghcr-signature-keyless
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/zavestudios/*"
          keyless:
            issuer: "https://token.actions.githubusercontent.com"
            # Tighten this further to specific repositories if desired.
            subjectRegExp: "https://github.com/zavestudios/.+"
