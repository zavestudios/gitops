apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: panchito
  namespace: argocd
  labels:
    zave.io/workload: panchito
    zave.io/tenant: "true"
spec:
  project: default
  source:
    repoURL: https://github.com/zavestudios/gitops
    targetRevision: main
    path: tenants/panchito
  destination:
    server: https://kubernetes.default.svc
    namespace: panchito
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
