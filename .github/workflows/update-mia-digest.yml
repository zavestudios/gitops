name: Update Mia Digest

on:
  repository_dispatch:
    types: [mia-image-published]
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest (sha256:...)"
        required: true
        type: string
      tag:
        description: "Version tag label (sha-xxxxxxx)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - name: Resolve inputs
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DIGEST="${{ inputs.digest }}"
            TAG="${{ inputs.tag }}"
          else
            DIGEST="${{ github.event.client_payload.digest }}"
            TAG="${{ github.event.client_payload.tag }}"
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Patch deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          FILE="tenants/mia/deployment.yaml"
          DIGEST="${{ steps.vars.outputs.digest }}"
          TAG="${{ steps.vars.outputs.tag }}"

          # Pin workload image to published immutable digest.
          sed -i -E "s#^([[:space:]]*image:[[:space:]]+ghcr\\.io/zavestudios/mia@).*$#\\1${DIGEST}#g" "${FILE}"
          # Keep workload version label aligned with build tag.
          sed -i -E "s#^([[:space:]]*app\\.kubernetes\\.io/version:[[:space:]]+).*$#\\1${TAG}#g" "${FILE}"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="${{ steps.vars.outputs.digest }}"
          if git diff --quiet -- tenants/mia/deployment.yaml; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tenants/mia/deployment.yaml
          git commit -m "chore(mia): promote image digest ${DIGEST}"
          git push origin HEAD:main
