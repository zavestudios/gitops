---
# Flux Kustomization for KeyCloak ExternalSecrets
# Deploys namespace and ExternalSecret resources before BigBang
# Dependency: platform-core (Vault + External Secrets Operator)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: on-prem-keycloak-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/keycloak
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  dependsOn:
    - name: on-prem-platform-core  # Requires Vault and External Secrets Operator
