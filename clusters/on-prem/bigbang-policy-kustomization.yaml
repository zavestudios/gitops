apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: on-prem-bigbang-policy
  namespace: flux-system
spec:
  dependsOn:
    - name: on-prem-bigbang-source
    - name: on-prem-bigbang-foundation
    - name: on-prem-bigbang-observability
  interval: 10m
  path: ./bigbang/policy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 20m
