apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: on-prem-bigbang-observability
  namespace: flux-system
spec:
  dependsOn:
    - name: on-prem-bigbang-source
    - name: on-prem-bigbang-foundation
  interval: 10m
  path: ./bigbang/observability
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
