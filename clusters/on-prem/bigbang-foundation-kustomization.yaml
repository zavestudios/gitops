apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: on-prem-bigbang-foundation
  namespace: flux-system
spec:
  dependsOn:
    - name: on-prem-platform-core
    - name: on-prem-keycloak-secrets
    - name: on-prem-bigbang-source
  interval: 10m
  path: ./bigbang/foundation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 20m
