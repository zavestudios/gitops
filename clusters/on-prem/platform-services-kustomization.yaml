apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: on-prem-platform-services
  namespace: flux-system
spec:
  dependsOn:
    # Owns the platform namespace where shared services are reconciled.
    - name: on-prem-platform-core
    # Supplies runtime capabilities consumed by shared services.
    - name: on-prem-platform-runtime
  interval: 2m
  path: ./platform/services
  prune: true
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 25m
