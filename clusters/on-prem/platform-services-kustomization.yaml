apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: on-prem-platform-services
  namespace: flux-system
spec:
  dependsOn:
    - name: on-prem-platform-runtime
  interval: 10m
  path: ./platform/services
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 25m
