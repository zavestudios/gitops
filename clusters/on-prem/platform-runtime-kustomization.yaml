apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: on-prem-platform-runtime
  namespace: flux-system
spec:
  dependsOn:
    # Owns the platform namespace used by the vault-reader ServiceAccount.
    - name: on-prem-platform-core
    # Own package namespaces consumed by runtime glue: vault/argocd,
    # kyverno CRDs, and alloy respectively.
    - name: on-prem-bigbang-foundation
    - name: on-prem-bigbang-policy
    - name: on-prem-bigbang-observability
  interval: 10m
  path: ./platform/runtime
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 20m
