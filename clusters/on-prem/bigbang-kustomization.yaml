apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: on-prem-bigbang
  namespace: flux-system
spec:
  dependsOn:
    - name: on-prem-platform-core
  interval: 10m
  path: ./bigbang
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 20m
