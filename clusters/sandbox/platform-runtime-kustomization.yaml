apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sandbox-platform-runtime
  namespace: flux-system
spec:
  dependsOn:
    - name: sandbox-bigbang
  interval: 10m
  path: ./platform/runtime
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 20m
